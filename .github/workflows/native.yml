name: Native macOS and Windows preview verification

on:
  workflow_call:
    inputs:
      alpha_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  platform:
    name: native preview ${{ matrix.platform }} (${{ matrix.required && 'required' || 'best effort' }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 90
    env:
      ALPHA_TAG: ${{ inputs.alpha_tag }}
      CARGO_BUILD_JOBS: '4'
      RETYPE_TEST_TIMEOUT_SECONDS: '900'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
            required: true
          - platform: macos-x86_64
            runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
            required: false
          - platform: windows-x86_64
            runner: windows-2025
            architecture: X64
            target: x86_64-pc-windows-msvc
            required: true
          - platform: windows-arm64
            runner: windows-11-arm
            architecture: Arm64
            target: aarch64-pc-windows-msvc
            required: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare report directory (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/retype-reports"
          printf 'RETYPE_TEST_REPORT_DIR=%s\n' "$RUNNER_TEMP/retype-reports" >> "$GITHUB_ENV"
          test "$(uname -m)" = '${{ matrix.architecture }}'
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$(id -u)" -ne 0
      - name: Prepare report directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:SystemDrive 'retype-reports'
          $scratch = Join-Path $env:SystemDrive 'retype-temp'
          if ((Get-Volume -DriveLetter $env:SystemDrive.TrimEnd(':')).FileSystem -ne 'NTFS') { throw 'Native cleanup tests require NTFS scratch storage.' }
          [IO.Directory]::CreateDirectory($report) | Out-Null
          [IO.Directory]::CreateDirectory($scratch) | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RETYPE_TEST_REPORT_DIR=$report" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RETYPE_TEST_TEMP_DIR=$scratch" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$scratch`nTMP=$scratch" -Encoding utf8
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.architecture }}') { throw 'Unexpected architecture' }
      - name: Install macOS tools
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./tests/prepare.sh 2>&1 | tee "$RETYPE_TEST_REPORT_DIR/setup.log"
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          Start-Transcript -Path (Join-Path $env:RETYPE_TEST_REPORT_DIR 'setup.log') | Out-Null
          try { & ./tests/prepare.ps1 } finally { Stop-Transcript | Out-Null }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Run macOS suite
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        run: ./tests/run.sh
      - name: Check macOS worker modes (source only)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 2
        run: python3 tests/macos-modes.py --report "$RETYPE_TEST_REPORT_DIR/worker-modes-source"
      - name: Check native macOS archive boundaries in owned staging
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        shell: bash
        timeout-minutes: 5
        run: |
          python3 tests/macos-archive.py --report "$RETYPE_TEST_REPORT_DIR/archive-boundaries" --allow-native-staging
      - name: Parse PowerShell scripts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          foreach ($path in @('packaging/install.ps1', 'tests/run.ps1',
              'tests/prepare.ps1', 'tests/hyperv-info.ps1',
              'tests/hyperv-check.ps1', 'tests/windows-storage-faults.ps1', 'tests/install.ps1',
              'crates/retype-cli/tests/support/windows_runner_probe.ps1',
              'tests/support/windows-user.ps1', 'packaging/windows/shortcut.ps1',
              'packaging/trust/verify.ps1', 'packaging/trust/verify-windows.ps1',
              'scripts/sign-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Test Hyper-V collector without a VM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          ./tests/support/windows-user.ps1 -Architecture '${{ matrix.architecture }}' -Command @'
          pwsh -NoProfile -NonInteractive -File ./tests/hyperv-check.ps1
          '@
      - name: Run Windows suite
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 45
        run: |
          if (-not (rustc -vV | Select-String -Pattern '^host: ${{ matrix.target }}$')) { throw 'Expected a native Rust host toolchain.' }
          ./tests/support/windows-user.ps1 -Architecture '${{ matrix.architecture }}' -Command @'
          pwsh -NoProfile -NonInteractive -File ./tests/run.ps1
          '@
      - name: Build macOS preview executable and earn its evidence
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          rustc -vV | grep -qx 'host: ${{ matrix.target }}'
          cargo build --release --locked -p retype-cli --bin retype
          binary=target/release/retype
          if [ -n "$ALPHA_TAG" ] && [ '${{ matrix.target }}' = aarch64-apple-darwin ]; then
            name="retype-$ALPHA_TAG-aarch64-apple-darwin"
            mkdir -p "dist/$name/bin"
            cp -p "$binary" "dist/$name/bin/retype"
            binary="dist/$name/bin/retype"
            /usr/bin/codesign --force --sign - --identifier com.lapilliworks.retype.cli "$binary"
          fi
          "$binary" --version
          "$binary" fidelity --pair png:jpg --pair png:webp --state-dir "$RUNNER_TEMP/retype-fidelity" \
            --write "$RETYPE_TEST_REPORT_DIR/fidelity.toml" --fixtures fixtures/fidelity > "$RETYPE_TEST_REPORT_DIR/fidelity.log" 2>&1
      - name: Build fresh unsigned macOS notifier bundle
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=v0.1.0-dev-${GITHUB_SHA:0:7}; fi
          bundle_version=${version#v}
          bundle_version=${bundle_version%%-*}
          bash packaging/macos/build.sh target/release/retype "$RETYPE_TEST_REPORT_DIR/preview/retype.app" "$bundle_version" '${{ matrix.target }}'
          cmp target/release/retype "$RETYPE_TEST_REPORT_DIR/preview/retype.app/Contents/Resources/retype"
      - name: Package and smoke-test the macOS alpha CLI archive
        if: matrix.target == 'aarch64-apple-darwin' && inputs.alpha_tag != ''
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          name="retype-$ALPHA_TAG-aarch64-apple-darwin"
          package="dist/$name"
          mkdir -p "$package/share/retype/fixtures"
          cp "$RETYPE_TEST_REPORT_DIR/fidelity.toml" "$package/share/retype/"
          cp -R fixtures/fidelity "$package/share/retype/fixtures/"
          cp README.md LICENSE "$package/"
          /usr/bin/tar --no-mac-metadata --no-xattrs -czf "$package.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          smoke=$(mktemp -d "$RUNNER_TEMP/retype-alpha.XXXXXX")
          /usr/bin/tar -xzf "$package.tar.gz" -C "$smoke"
          binary="$smoke/$name/bin/retype"
          cmp "$package/bin/retype" "$binary"
          cmp "$RETYPE_TEST_REPORT_DIR/fidelity.toml" "$smoke/$name/share/retype/fidelity.toml"
          /usr/bin/codesign --verify --strict "$binary"
          [ "$("$binary" --version)" = "retype ${ALPHA_TAG#v}" ]
      - name: Build Windows CLI and Review launcher and earn fidelity evidence
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          ./tests/support/windows-user.ps1 -Architecture '${{ matrix.architecture }}' -Command @'
          cargo build --release --locked -p retype-cli --features windows-review --bins
          & target/release/retype.exe fidelity --pair png:jpg --pair png:webp --state-dir "$env:TEMP/retype-fidelity" --write (Join-Path $env:RETYPE_TEST_REPORT_DIR 'fidelity.toml') --fixtures fixtures/fidelity *> (Join-Path $env:RETYPE_TEST_REPORT_DIR 'fidelity.log')
          '@
      - name: Package and smoke-test exact Windows unsigned preview archive
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          if ($env:ALPHA_TAG) {
            $version = $env:ALPHA_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = 'v0.1.0-dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $name = 'retype-' + $version + '-${{ matrix.target }}'
          New-Item -ItemType Directory -Path "dist/$name/bin", "dist/$name/share/retype/fixtures" | Out-Null
          Copy-Item -LiteralPath 'target/release/retype.exe', 'target/release/retype-review.exe' -Destination "dist/$name/bin/"
          Copy-Item (Join-Path $env:RETYPE_TEST_REPORT_DIR 'fidelity.toml') "dist/$name/share/retype/"
          Copy-Item fixtures/fidelity "dist/$name/share/retype/fixtures/" -Recurse
          Copy-Item packaging "dist/$name/share/retype/" -Recurse
          Copy-Item README.md, LICENSE "dist/$name/"
          & tar.exe -czf "dist/$name.tar.gz" -C dist $name
          if ($LASTEXITCODE -ne 0) { throw 'Archive assembly failed.' }
          $archive = (Resolve-Path "dist/$name.tar.gz").Path
          $sha = (Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$sha  $name.tar.gz`n")
          $command = "python tests/installed.py '$archive' --preview-cli-only --allow-user-integration " +
            "--report '$env:RETYPE_TEST_REPORT_DIR/preview-cli-installed'"
          ./tests/support/windows-user.ps1 -Architecture '${{ matrix.architecture }}' -Command $command
      - name: Record macOS filesystem events
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p retype-watch --example probe_events 2>&1 | tee "$RETYPE_TEST_REPORT_DIR/filesystem-events.log"
      - name: Record Windows filesystem events
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tests/support/windows-user.ps1 -Architecture '${{ matrix.architecture }}' -Command @'
          cargo run --quiet --locked -p retype-watch --example probe_events 2>&1 | Tee-Object -FilePath (Join-Path $env:RETYPE_TEST_REPORT_DIR 'filesystem-events.log')
          '@
      - name: Upload native preview reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-preview-${{ matrix.platform }}
          path: ${{ env.RETYPE_TEST_REPORT_DIR }}
          if-no-files-found: error
      - name: Upload checked preview CLI/data archive
        if: runner.os == 'Windows' || (matrix.target == 'aarch64-apple-darwin' && inputs.alpha_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: retype-preview-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
