name: Debian stable qualification

on:
  workflow_call:
    inputs:
      alpha_tag:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Debian 13 ${{ matrix.target }} (${{ matrix.required && 'required' || 'best effort' }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    container: debian:trixie
    timeout-minutes: 75
    env:
      ALPHA_TAG: ${{ inputs.alpha_tag }}
      ALPHA_MUSL_TARGET: >-
        ${{ inputs.alpha_tag != '' && matrix.target == 'x86_64-unknown-linux-gnu' && matrix.musl_target || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            evidence: linux-x86_64
            required: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            evidence: linux-arm64
            required: false
    steps:
      - name: Prepare stable build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config procps util-linux xz-utils python3
          mkdir -p /opt/retype-cargo /opt/retype-rustup
          printf 'CARGO_HOME=/opt/retype-cargo\nRUSTUP_HOME=/opt/retype-rustup\n' >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install converters and compatible Typst
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./tests/prepare.sh
          typst_dir="$RUNNER_TEMP/typst-0.11.1"
          mkdir -p "$typst_dir"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/typst/typst/releases/download/v0.11.1/typst-${{ matrix.musl_target }}.tar.xz" \
            -o "$typst_dir/typst.tar.xz"
          tar -xJf "$typst_dir/typst.tar.xz" -C "$typst_dir"
          printf '%s\n' "$typst_dir/typst-${{ matrix.musl_target }}" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the alpha musl build tools
        if: env.ALPHA_MUSL_TARGET != ''
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends musl-tools
          rustup target add "$ALPHA_MUSL_TARGET"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
          fallback: none
      - name: Strict native userspace suite
        shell: bash
        timeout-minutes: 20
        env:
          RETYPE_TEST_TIMEOUT_SECONDS: '600'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retype-reports" "$RUNNER_TEMP/retype-fidelity"
          printf 'RETYPE_TEST_REPORT_DIR=%s\n' "$RUNNER_TEMP/retype-reports" >> "$GITHUB_ENV"
          chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/retype-reports" \
            "$RUNNER_TEMP/retype-fidelity" "$CARGO_HOME" "$RUSTUP_HOME"
          setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all \
            env RETYPE_TEST_REPORT_DIR="$RUNNER_TEMP/retype-reports" ./tests/run.sh
      - name: Build, package and check Linux archives
        shell: bash
        timeout-minutes: 30
        env:
          GNU_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          if [ -n "$ALPHA_TAG" ]; then
            version=$ALPHA_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=v0.1.0-dev-${GITHUB_SHA:0:7}
          fi
          worker=(setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all)
          targets=("$GNU_TARGET")
          if [ -n "$ALPHA_MUSL_TARGET" ]; then targets+=("$ALPHA_MUSL_TARGET"); fi
          for target in "${targets[@]}"; do
            binary="target/$target/release/retype"
            name="retype-$version-$target"
            report="$RETYPE_TEST_REPORT_DIR/$target"
            state="$RUNNER_TEMP/retype-fidelity/$target"
            "${worker[@]}" mkdir -p "$report" "$state"
            "${worker[@]}" cargo build --release --locked --target "$target" -p retype-cli --bin retype
            "${worker[@]}" "$binary" fidelity --pair png:jpg --pair png:webp \
              --state-dir "$state" --write "$report/fidelity.toml" \
              --fixtures fixtures/fidelity > "$report/fidelity.log" 2>&1
            readelf --version-info "$binary" > "$report/symbols.log"

            mkdir -p "dist/$name/bin" "dist/$name/share/retype/fixtures"
            cp "$binary" "dist/$name/bin/"
            cp "$report/fidelity.toml" "dist/$name/share/retype/"
            cp -R fixtures/fidelity "dist/$name/share/retype/fixtures/"
            cp -R packaging "dist/$name/share/retype/"
            cp README.md LICENSE "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

            if [ "$target" = "$GNU_TARGET" ]; then
              "${worker[@]}" python3 tests/installed.py "dist/$name.tar.gz" --preview --report "$report/installed"
              continue
            fi
            smoke=$("${worker[@]}" mktemp -d /tmp/retype-alpha.XXXXXX)
            "${worker[@]}" tar -xzf "dist/$name.tar.gz" -C "$smoke"
            extracted="$smoke/$name/bin/retype"
            "${worker[@]}" cmp "$binary" "$extracted"
            "${worker[@]}" cmp "$report/fidelity.toml" "$smoke/$name/share/retype/fidelity.toml"
            "${worker[@]}" "$extracted" --version > "$report/version.log"
            grep -Fx "retype ${ALPHA_TAG#v}" "$report/version.log"
            "${worker[@]}" readelf --program-headers --wide "$extracted" > "$report/program-headers.log"
            "${worker[@]}" readelf --dynamic --wide "$extracted" > "$report/dynamic.log"
            if grep -E '^[[:space:]]*INTERP[[:space:]]|\(NEEDED\)' "$report/program-headers.log" "$report/dynamic.log"; then
              echo 'The musl alpha executable must be statically linked.' >&2
              exit 1
            fi
          done
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.evidence }}
          path: ${{ runner.temp }}/retype-reports
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: retype-preview-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.tar.gz
            dist/*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.ALPHA_MUSL_TARGET != ''
        with:
          name: retype-preview-${{ env.ALPHA_MUSL_TARGET }}
          path: |
            dist/*-${{ env.ALPHA_MUSL_TARGET }}.tar.gz
            dist/*-${{ env.ALPHA_MUSL_TARGET }}.tar.gz.sha256
          if-no-files-found: error
