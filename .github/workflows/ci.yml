name: ci

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'sites/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'sites/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    name: Debian stable
    uses: ./.github/workflows/debian.yml

  native:
    name: native verification
    uses: ./.github/workflows/native.yml

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint"'

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run MSRV workspace tests
        timeout-minutes: 10
        run: RETYPE_TEST_SESSION=terminal cargo test --workspace --locked --no-fail-fast

  cross:
    name: cross check (typecheck foreign targets)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.target != 'x86_64-pc-windows-msvc' && matrix.target != 'aarch64-apple-darwin' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [
          x86_64-pc-windows-msvc,
          aarch64-pc-windows-msvc,
          aarch64-unknown-linux-gnu,
          aarch64-apple-darwin,
          x86_64-unknown-freebsd,
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  installer:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare installer test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 xdg-utils desktop-file-utils libglib2.0-bin minisign
      - name: Parse Unix packaging and signing scripts
        run: |
          for file in packaging/install.sh packaging/trust/*.sh scripts/sign-release.sh scripts/sign-macos.sh; do
            bash -n "$file" || exit
          done
      - run: bash tests/install.sh
      - run: python3 tests/test_installed.py
      - run: python3 scripts/embed-trust.py --check packaging/install.sh
      - run: python3 scripts/embed-trust.py --check packaging/install.ps1
      - run: timeout --kill-after=5s 30s bash tests/release.sh
