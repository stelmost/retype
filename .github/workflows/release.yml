name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      unsigned_alpha:
        description: Stage a draft prerelease with unsigned CLI downloads
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alpha_tag: ${{ steps.version.outputs.alpha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the workspace version
        id: version
        shell: bash
        env:
          UNSIGNED_ALPHA: ${{ inputs.unsigned_alpha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || {
              echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
              exit 1
            }
          fi
          if [ "$UNSIGNED_ALPHA" = true ]; then
            [[ $GITHUB_REF_TYPE == branch && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]] || {
              echo 'Draft preparation requires a branch and an alpha workspace version.' >&2
              exit 1
            }
            printf 'alpha_tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          fi

  debian:
    name: Debian 13 preview build and installed verification
    needs: verify
    uses: ./.github/workflows/debian.yml
    with:
      alpha_tag: ${{ needs.verify.outputs.alpha_tag }}

  native:
    name: native preview verification
    needs: verify
    uses: ./.github/workflows/native.yml
    with:
      alpha_tag: ${{ needs.verify.outputs.alpha_tag }}

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run release workspace tests
        timeout-minutes: 10
        run: RETYPE_TEST_SESSION=terminal cargo test --workspace --locked --no-fail-fast -- --test-threads=4
      - name: Prepare installer test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 xdg-utils desktop-file-utils libglib2.0-bin minisign
      - run: bash -n packaging/install.sh
      - run: bash tests/install.sh
      - run: python3 tests/test_installed.py
      - run: python3 scripts/embed-trust.py --check packaging/install.sh
      - run: python3 scripts/embed-trust.py --check packaging/install.ps1
      - run: timeout --kill-after=5s 30s bash tests/release.sh
      - run: test -s packaging/install.ps1

  package:
    name: assemble unsigned preview assets
    if: github.event_name == 'workflow_dispatch' && !inputs.unsigned_alpha
    needs: [native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: retype-preview-*
          path: dist
          merge-multiple: true
      - name: Verify archives and generate canonical installer closure
        run: bash scripts/assemble-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-assets
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/install.sh
            dist/install.ps1
            dist/install.sh.sha256
            dist/install.ps1.sha256
            dist/SHA256SUMS
          if-no-files-found: error

  alpha-draft:
    name: stage unsigned CLI alpha draft
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned_alpha
    needs: [verify, checks, native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: unsigned-alpha-${{ needs.verify.outputs.alpha_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: retype-preview-*
          path: dist
          merge-multiple: true
      - name: Verify the required alpha archives
        env:
          TAG: ${{ needs.verify.outputs.alpha_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir alpha
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive="retype-$TAG-$target.tar.gz"
            cp -- "dist/$archive" "dist/$archive.sha256" alpha/
          done
          bash scripts/assemble-release.sh --archives-only alpha
      - name: Create an unpublished prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.alpha_tag }}
        working-directory: alpha
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" |
            jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref != $ref)' >/dev/null; then
            echo "Could not confirm that $TAG is unused." >&2
            exit 1
          fi
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Retype ${TAG#v} (unsigned CLI alpha)" --notes-file - ./*.tar.gz SHA256SUMS <<'NOTES'
          This alpha provides the Retype CLI and daemon as manual downloads:

          - Linux x86-64 with glibc 2.41 or newer (`x86_64-unknown-linux-gnu`)
          - Linux x86-64 with a statically linked CLI (`x86_64-unknown-linux-musl`)
          - Windows x86-64 (`x86_64-pc-windows-msvc`)
          - macOS 15 on Apple silicon (`aarch64-apple-darwin`)

          Extract the matching archive, keep `bin/` and `share/` together, and run
          `bin/retype --version` or `bin/retype.exe --version`.
          Install any external converters separately.

          SHA256SUMS covers download integrity. The macOS executable has an ad-hoc signature.
          Windows and macOS may warn when opening a downloaded executable. A source build is available
          for systems that require a trusted publisher. Desktop installation and integration
          are outside the scope of this alpha.
          NOTES

  publish:
    name: publish signed release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, checks, native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: signed-release
    concurrency:
      group: signed-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Download the approved draft into private staging
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ vars.RETYPE_CANDIDATE_RELEASE_ID }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $CANDIDATE_RELEASE_ID =~ ^[1-9][0-9]*$ ]] || { echo 'No approved draft release ID' >&2; exit 1; }
          candidate=$(gh api "repos/$GITHUB_REPOSITORY/releases/$CANDIDATE_RELEASE_ID")
          jq -e --arg tag "candidate-$TAG" '.draft and .tag_name == $tag' <<< "$candidate" >/dev/null
          assets=$(jq -er '.assets[] | select(.state == "uploaded") | [.id, .name] | @tsv' <<< "$candidate")
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/retype-release.XXXXXX")
          while IFS=$'\t' read -r id name; do
            [[ $id =~ ^[1-9][0-9]*$ && $name =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ && ! -e "$directory/$name" ]]
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$directory/$name"
          done <<< "$assets"
          printf 'RETYPE_RELEASE_ASSETS=%s\n' "$directory" >> "$GITHUB_ENV"
      - name: Verify the publisher and exact qualified candidate
        env:
          RETYPE_CANDIDATE_QUALIFICATION_SHA256: ${{ vars.RETYPE_CANDIDATE_QUALIFICATION_SHA256 }}
          RETYPE_PUBLISHER_KEY: ${{ vars.RETYPE_PUBLISHER_KEY }}
          RETYPE_MACOS_TEAM_ID: ${{ vars.RETYPE_MACOS_TEAM_ID }}
          RETYPE_PUBLISHER_CERTIFICATE_SHA256: ${{ vars.RETYPE_PUBLISHER_CERTIFICATE_SHA256 }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-release-candidate.py "$RETYPE_RELEASE_ASSETS" "$TAG" "$(git rev-parse HEAD)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "${prerelease[@]}" "$RETYPE_RELEASE_ASSETS"/*
