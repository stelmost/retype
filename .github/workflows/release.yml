name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          }

  debian:
    name: Debian 13 preview build and installed verification
    uses: ./.github/workflows/debian.yml

  native:
    name: native preview verification
    uses: ./.github/workflows/native.yml

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run release workspace tests
        timeout-minutes: 10
        run: RETYPE_TEST_SESSION=terminal cargo test --workspace --locked --no-fail-fast
      - name: Prepare installer test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 xdg-utils desktop-file-utils libglib2.0-bin minisign
      - run: bash -n packaging/install.sh
      - run: bash tests/install.sh
      - run: python3 tests/test_installed.py
      - run: python3 scripts/embed-trust.py --check packaging/install.sh
      - run: python3 scripts/embed-trust.py --check packaging/install.ps1
      - run: timeout --kill-after=5s 30s bash tests/release.sh
      - run: test -s packaging/install.ps1

  package:
    name: assemble unsigned preview assets
    if: github.event_name == 'workflow_dispatch'
    needs: [native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: retype-preview-*
          path: dist
          merge-multiple: true
      - name: Verify archives and generate canonical installer closure
        run: bash scripts/assemble-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-assets
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/install.sh
            dist/install.ps1
            dist/install.sh.sha256
            dist/install.ps1.sha256
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish signed release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, checks, native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: signed-release
    concurrency:
      group: signed-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Download the approved draft into private staging
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ vars.RETYPE_CANDIDATE_RELEASE_ID }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $CANDIDATE_RELEASE_ID =~ ^[1-9][0-9]*$ ]] || { echo 'No approved draft release ID' >&2; exit 1; }
          candidate=$(gh api "repos/$GITHUB_REPOSITORY/releases/$CANDIDATE_RELEASE_ID")
          jq -e --arg tag "candidate-$TAG" '.draft and .tag_name == $tag' <<< "$candidate" >/dev/null
          assets=$(jq -er '.assets[] | select(.state == "uploaded") | [.id, .name] | @tsv' <<< "$candidate")
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/retype-release.XXXXXX")
          while IFS=$'\t' read -r id name; do
            [[ $id =~ ^[1-9][0-9]*$ && $name =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ && ! -e "$directory/$name" ]]
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$directory/$name"
          done <<< "$assets"
          printf 'RETYPE_RELEASE_ASSETS=%s\n' "$directory" >> "$GITHUB_ENV"
      - name: Verify the publisher and exact qualified candidate
        env:
          RETYPE_CANDIDATE_QUALIFICATION_SHA256: ${{ vars.RETYPE_CANDIDATE_QUALIFICATION_SHA256 }}
          RETYPE_PUBLISHER_KEY: ${{ vars.RETYPE_PUBLISHER_KEY }}
          RETYPE_MACOS_TEAM_ID: ${{ vars.RETYPE_MACOS_TEAM_ID }}
          RETYPE_PUBLISHER_CERTIFICATE_SHA256: ${{ vars.RETYPE_PUBLISHER_CERTIFICATE_SHA256 }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-release-candidate.py "$RETYPE_RELEASE_ASSETS" "$TAG" "$(git rev-parse HEAD)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "${prerelease[@]}" "$RETYPE_RELEASE_ASSETS"/*
