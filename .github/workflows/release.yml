name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          }

  debian:
    name: Debian 13 preview build and installed verification
    uses: ./.github/workflows/debian.yml

  native:
    name: native preview verification
    uses: ./.github/workflows/native.yml

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run release workspace tests
        timeout-minutes: 10
        run: RETYPE_TEST_SESSION=terminal cargo test --workspace --locked --no-fail-fast
      - name: Prepare installer test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 xdg-utils desktop-file-utils libglib2.0-bin
      - run: bash -n packaging/install.sh
      - run: bash tests/install.sh
      - run: python3 tests/test_installed.py
      - run: python3 scripts/embed-trust.py --check packaging/install.sh
      - run: python3 scripts/embed-trust.py --check packaging/install.ps1
      - run: timeout --kill-after=5s 30s bash tests/release.sh
      - run: test -s packaging/install.ps1
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/install.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

  package:
    name: assemble ${{ github.event_name == 'workflow_dispatch' && 'unsigned preview' || 'signed release' }} assets
    needs: [native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event_name == 'workflow_dispatch' && 'retype-preview-*' || 'retype-signed-*' }}
          path: dist
          merge-multiple: true
      - name: Require every signed and qualified primary archive
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive="dist/retype-$GITHUB_REF_NAME-$target.tar.gz"
            test -s "$archive" || { echo "Missing signed/qualified archive: $archive" >&2; exit 1; }
          done
      - name: Verify archives and generate canonical installer closure
        run: bash scripts/assemble-release.sh dist
      - name: Sign and verify the final publisher manifest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sign-release.sh dist \
            "${RETYPE_SIGNING_KEY_FILE:?An approved existing key path is required}" \
            "${RETYPE_PUBLISHER_KEY:?An independently approved publisher key is required}"
          for asset in dist/*.tar.gz dist/install.sh dist/install.ps1; do
            bash packaging/trust/verify.sh "$asset" dist/SHA256SUMS dist/SHA256SUMS.minisig "$RETYPE_PUBLISHER_KEY"
          done
      - name: Attest signed and qualified native archives
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'unsigned-preview-assets' || 'release-assets' }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/install.sh
            dist/install.ps1
            dist/install.sh.sha256
            dist/install.ps1.sha256
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          if-no-files-found: error

  publish:
    name: publish signed release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, package, checks, native, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify publisher-authenticated release assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/install.sh dist/install.ps1; do
            bash packaging/trust/verify.sh "$asset" dist/SHA256SUMS dist/SHA256SUMS.minisig \
              "${RETYPE_PUBLISHER_KEY:?An independently approved publisher key is required}"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=''
          case "$TAG" in *-*) prerelease='--prerelease' ;; esac
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/install.sh dist/install.ps1
            dist/install.sh.sha256 dist/install.ps1.sha256 dist/SHA256SUMS dist/SHA256SUMS.minisig)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A retry must not replace an existing published asset.
            gh release upload "$TAG" "${assets[@]}"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes $prerelease
          fi
